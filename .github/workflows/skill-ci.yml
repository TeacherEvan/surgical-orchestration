---
name: Skill Validation

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate surgical-orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conformance gate (family standard)
        run: python3 -B scripts/conform.py

      - name: Install Python validation tools
        run: |
          pip install --no-cache-dir \
            pytest pyyaml jsonschema ruff mypy yamllint check-jsonschema

      - name: Install TypeScript dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck, unit tests, and schema drift
        run: |
          npm run typecheck
          npx tsx tests/security.test.ts
          npx tsx tests/orchestrator.review.test.ts
          npx tsx tests/schema-drift.test.ts
          npx tsx tests/engine.test.ts

      - name: TypeScript benchmark suite
        run: npm run bench

      - name: Validate JSON Schemas and build plans
        run: |
          check-jsonschema --check-metaschema references/*-schema.json
          check-jsonschema \
            --schemafile references/build-plan-schema.json \
            references/build-plan.json \
            benchmarks/fixtures/*.plan.json

      - name: Run Python test suite
        run: pytest -v tests/

      - name: Lint and typecheck Python scripts and tests
        run: |
          ruff check scripts/ tests/
          ruff format --check scripts/ tests/
          mypy --strict --ignore-missing-imports scripts/ tests/

      - name: Lint shell scripts and workflow YAML
        run: |
          bash -n scripts/sync-skill.sh
          shellcheck -x scripts/sync-skill.sh
          yamllint .github/workflows/skill-ci.yml
