name: skill-conform

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conform:
    name: Skill authoring conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run conformance gate
        run: python3 scripts/conform.py

  # The skill's own documented verification recipe, made real. Isolated temp
  # dir per references/verify-skill-typescript.md: never npm install inside
  # references/, and always add --types node so node builtins type-check.
  typescript:
    name: Typecheck + behaviour tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify in isolated temp dir
        run: |
          set -euo pipefail
          SKILL_ROOT="$PWD"
          WORK="$(mktemp -d)"
          cp "$SKILL_ROOT"/references/*.ts "$WORK"/
          cp "$SKILL_ROOT"/references/*.json "$WORK"/
          cd "$WORK"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund typescript@5 @types/node tsx >/dev/null 2>&1
          echo "== tsc (prescribed flags) =="
          npx tsc --noEmit --strict --skipLibCheck --module node16 \
            --moduleResolution node16 --target es2022 --types node *.ts
          echo "== behaviour tests =="
          npx tsx orchestrator.review.test.ts
          npx tsx security.test.ts

  bench:
    name: Bench suite (accuracy / timing / token)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run bench tests
        run: |
          set -euo pipefail
          SKILL_ROOT="$PWD"
          WORK="$(mktemp -d)"
          cp -r "$SKILL_ROOT"/references "$WORK"/references
          cd "$WORK/references"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund typescript@5 @types/node tsx >/dev/null 2>&1
          npx tsx bench/accuracy.test.ts
          npx tsx bench/timing.test.ts
          npx tsx bench/token.test.ts
          # bench/e2e.spec.ts is intentionally NOT run here: it needs
          # @playwright/test + browsers and there is no playwright.config in
          # the skill tree. Add it when the config lands.
